<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Keep these in sync with brand.name / brand.tagline in assets/js/content.js.
     They are static so crawlers and link previews see them without running JS. -->
<title>Project Optic | Pop rock from Bangalore</title>
<meta name="description" content="Project Optic is a Bangalore band playing pop rock, Bollywood, indie Hindi and Kannada songs.">
<link rel="canonical" href="https://project-optic.netlify.app/">
<meta property="og:type" content="website">
<meta property="og:url" content="https://project-optic.netlify.app/">
<meta property="og:site_name" content="Project Optic">
<meta property="og:title" content="Project Optic | Pop rock from Bangalore">
<meta property="og:description" content="Project Optic is a Bangalore band playing pop rock, Bollywood, indie Hindi and Kannada songs.">
<meta property="og:image" content="https://project-optic.netlify.app/assets/img/og-cover.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Project Optic | Pop rock from Bangalore">
<meta name="twitter:description" content="Project Optic is a Bangalore band playing pop rock, Bollywood, indie Hindi and Kannada songs.">
<meta name="twitter:image" content="https://project-optic.netlify.app/assets/img/og-cover.png">
<meta name="theme-color" content="#0d0f1e">

<link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
<link rel="apple-touch-icon" href="assets/img/icon-180.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600&family=Noto+Sans+Kannada:wght@400;600&display=swap" rel="stylesheet">

<!-- Stylesheets are layered: tokens (the theme) → base → layout → components
     → sections. Later files only ever consume variables from tokens.css. -->
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/layout.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/sections.css">
</head>

<body>

<a class="skip" href="#about">Skip to content</a>

<canvas id="backdrop" aria-hidden="true"></canvas>

<!-- ==========================================================================
     Every element below is an empty shell. assets/js/main.js fills each one
     from assets/js/content.js. To reorder the page, move a <section> here and
     move its matching line in the SECTIONS list in main.js.
     ========================================================================== -->

<header class="nav" id="nav"></header>

<header class="hero" id="top"></header>

<div class="marquee" id="marquee"></div>

<main>
  <section class="section" id="about"   aria-label="About the band"></section>
  <section class="section" id="repertoire" aria-label="What we play"></section>
  <section class="section" id="videos"  aria-label="Videos"></section>
  <section class="section" id="shows"   aria-label="Shows"></section>
  <section class="section section--tight" id="listen" aria-label="Follow along"></section>
  <section class="section section--tight" id="ep"     aria-label="Upcoming EP"></section>
  <section class="section" id="book"    aria-label="Booking"></section>
</main>

<footer class="footer" id="footer"></footer>

<script type="module" src="assets/js/main.js"></script>
</body>
</html>
